name: Freeze NFL predictions

# Writes down each NFL game's pre-game prediction ~45 min before its slate kicks off, so the
# predictions log never re-predicts a played game with later data. Also pulls in what the
# deployed API froze on its own (a redeploy wipes the server's disk).
# Kickoffs (UTC, Eastern daylight time): TNF 00:15 Fri · Sun 13:30 (intl) / 17:00 / 20:05–20:25 ·
# SNF 00:20 Mon · MNF 00:15 Tue.
on:
  schedule:
    - cron: "30 23 * 1,2,9-12 4"   # Thursday night
    - cron: "45 12 * 1,2,9-12 0"   # Sunday international
    - cron: "15 16 * 1,2,9-12 0"   # Sunday early
    - cron: "20 19 * 1,2,9-12 0"   # Sunday late
    - cron: "30 23 * 1,2,9-12 0"   # Sunday night
    - cron: "30 23 * 1,2,9-12 1"   # Monday night
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Freeze
        env:
          API_URL: https://nba-playoff-predictor-u8bj.onrender.com
        run: python nfl/freeze_predictions.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl/nfl_frozen_predictions.json data/pregame_odds.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Freeze NFL predictions ($(date -u +%F' '%H:%M))"
          git pull --rebase
          git push
