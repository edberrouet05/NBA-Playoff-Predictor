name: Keep the API awake

# Render's free tier puts the API to sleep after 15 minutes without traffic, and the next
# visitor waits 30-60 s for it to wake up. A ping every 10 minutes keeps it awake from 8 am to
# 2 am Eastern; overnight it may sleep (about 560 instance hours a month, under the 750 free).
# GitHub runs scheduled workflows on a best-effort basis: a ping can come late now and then.
on:
  schedule:
    - cron: "*/10 0-5,12-23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://nba-playoff-predictor-u8bj.onrender.com/api/health; then
              echo; echo "Awake"; exit 0
            fi
            echo "Attempt $attempt failed, retrying"; sleep 10
          done
          echo "API did not answer"; exit 1
