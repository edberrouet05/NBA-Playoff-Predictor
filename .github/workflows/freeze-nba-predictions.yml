name: Freeze NBA predictions

# Writes down each NBA game's pre-game prediction (with that day's injury report) before
# tip-off, so the predictions log never re-predicts a played game with later data. Also pulls
# in what the deployed API froze on its own as the home page was served (a redeploy wipes the
# server's disk). Most games tip off between 7 and 10:30 pm ET: one run before the first wave,
# one before the West Coast games.
on:
  schedule:
    - cron: "30 22 * 1-6,10-12 *"   # 6:30 pm EDT / 5:30 pm EST
    - cron: "30 1 * 1-6,10-12 *"    # 9:30 pm EDT / 8:30 pm EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Freeze
        env:
          API_URL: https://nba-playoff-predictor-u8bj.onrender.com
        run: python nba/freeze_predictions.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba/nba_frozen_predictions.json data/nfl/nfl_frozen_predictions.json data/pregame_odds.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Freeze NBA predictions ($(date -u +%F' '%H:%M))"
          git pull --rebase
          git push
